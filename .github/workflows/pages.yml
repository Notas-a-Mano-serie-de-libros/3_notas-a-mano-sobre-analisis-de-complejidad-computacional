name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "simulaciones/**"
      - "common/**"
      - "core/**"
      - "recursos/**"
      - "mkdocs.yml"
      - "requirements-ci.txt"
      - "requirements-docs.txt"
      - "requirements-publish.txt"
      - "requirements-lock.txt"
      - "SECURITY.md"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/pages.yml"
      - "desarrollo/scripts/integrate_laboratories_into_chapters.py"
      - "desarrollo/scripts/editorial_math.py"
      - "desarrollo/scripts/normalize_editorial_math.py"
      - "desarrollo/scripts/validate_editorial_content.py"
      - "desarrollo/scripts/validate_book_structure.py"
      - "desarrollo/scripts/validate_page_assets.py"
      - "desarrollo/scripts/validate_pages_breadcrumbs.py"
      - "desarrollo/scripts/validate_external_references.py"
      - "desarrollo/scripts/validate_web_dependencies.py"
      - "desarrollo/scripts/check_secrets.py"
      - "desarrollo/scripts/benchmark_jupyterlite_runtime.py"
      - "desarrollo/scripts/data/book_structure.json"
      - "desarrollo/scripts/sync_book_code.py"
      - "desarrollo/scripts/data/book_code.json"
      - "desarrollo/scripts/data/book_pdf_listings.json"
      - "desarrollo/scripts/data/book_translations.json"
      - "desarrollo/scripts/book_code_languages.py"
      - "desarrollo/scripts/example_runner.py"
      - "desarrollo/scripts/java_examples.py"
      - "desarrollo/scripts/build_java_examples.py"
      - "desarrollo/scripts/c_examples.py"
      - "desarrollo/scripts/build_c_examples.py"
      - "desarrollo/scripts/sync_page_assets.py"
      - "desarrollo/scripts/sync_local_execution.py"
      - "desarrollo/scripts/build_jupyterlite_demo.py"
      - "desarrollo/jupyterlite_autorun_extension/**"
      - "desarrollo/scripts/jupyterlite_catalog.py"
      - "desarrollo/scripts/sync_jupyterlite_urls.py"
      - "desarrollo/scripts/validate_jupyterlite_artifact.py"
      - "Makefile"
      - "jupyterlite/**"
      - "desarrollo/scripts/data/page_asset_sources.json"
      - "desarrollo/scripts/check_c_examples.mjs"
      - "desarrollo/scripts/c/**"
      - "desarrollo/scripts/java/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL for deploy commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-docs.txt
            requirements-publish.txt
            requirements-lock.txt
      - name: Install documentation and simulation dependencies
        run: |
          python -m pip install -r requirements-ci.txt -c requirements-lock.txt
          python -m pip install -r requirements-publish.txt -c requirements-lock.txt
      - name: Audit dependencies used by the deployable artifact
        run: |
          python -m pip_audit -r requirements-ci.txt --progress-spinner off
          python -m pip_audit -r requirements-publish.txt --progress-spinner off
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java examples
        run: python desarrollo/scripts/build_java_examples.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate C WebAssembly examples
        run: |
          python desarrollo/scripts/build_c_examples.py --check
          node desarrollo/scripts/check_c_examples.mjs
      - name: Build documentation
        run: |
          python desarrollo/scripts/sync_page_assets.py
          python desarrollo/scripts/sync_local_execution.py
          make validate PYTHON=python
          python -m mkdocs build --strict
      - name: Validate breadcrumbs on every content page
        run: python desarrollo/scripts/validate_pages_breadcrumbs.py --site-dir site
      - name: Build JupyterLite demo
        run: python desarrollo/scripts/build_jupyterlite_demo.py
      - name: Validate generated JupyterLite artifact
        run: python desarrollo/scripts/validate_jupyterlite_artifact.py
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy site
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
      - codeql
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
