name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
      - "scripts/integrate_laboratories_into_chapters.py"
      - "scripts/editorial_math.py"
      - "scripts/normalize_editorial_math.py"
      - "scripts/validate_editorial_content.py"
      - "scripts/sync_book_code.py"
      - "scripts/data/book_code.json"
      - "scripts/data/book_translations.json"
      - "scripts/book_code_languages.py"
      - "scripts/example_runner.py"
      - "scripts/java_examples.py"
      - "scripts/build_java_examples.py"
      - "scripts/java/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile Java examples
        run: python scripts/build_java_examples.py
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Validate editorial structure and equations
        run: python scripts/validate_editorial_content.py
      - name: Validate breadcrumbs on every content page
        run: python scripts/validate_pages_breadcrumbs.py --site-dir site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
