name: Deploy AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "desarrollo/services/exercise-generator-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Exercise Generator Worker to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Deploy Worker with Wrangler
        working-directory: "desarrollo/services/exercise-generator-worker"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx wrangler deploy
          echo "${GEMINI_API_KEY}" | npx wrangler secret put GEMINI_API_KEY
