name: Deploy AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "desarrollo/services/exercise-generator-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ai-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Exercise Generator Worker to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Deploy Worker with Wrangler
        working-directory: "desarrollo/services/exercise-generator-worker"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx wrangler deploy
          echo "${GEMINI_API_KEY}" | npx wrangler secret put GEMINI_API_KEY
