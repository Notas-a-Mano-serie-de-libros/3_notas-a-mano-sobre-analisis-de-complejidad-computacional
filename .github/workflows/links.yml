name: Published links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: published-links
  cancel-in-progress: true

jobs:
  check:
    name: Check published links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check external links
        run: python desarrollo/scripts/check_published_links.py --live
