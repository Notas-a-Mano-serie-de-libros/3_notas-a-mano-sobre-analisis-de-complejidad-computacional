[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [
  ".git",
  ".pytest_cache",
  "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E9",
  "F",
]

[tool.ruff.lint.per-file-ignores]
# Los notebooks repiten imports en celdas autocontenidas y los cargadores de
# Colab importan módulos después de preparar sys.path de forma intencional.
"*.ipynb" = ["F401", "F811"]
