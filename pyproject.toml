[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [
  ".git",
  ".pytest_cache",
  "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
  "E9",
  "F",
  "B",
  "I",
]

[tool.ruff.lint.per-file-ignores]
# Los notebooks repiten imports en celdas autocontenidas y los cargadores de
# Colab importan módulos después de preparar sys.path de forma intencional.
"*.ipynb" = ["F401", "F811"]
# desarrollo/tests/test_performance_contracts.py verifica el texto literal de
# este import separado; se deja fuera del reordenamiento de isort a propósito.
"core/sort/sort_config.py" = ["I001"]
